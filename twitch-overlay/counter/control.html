<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Odinheim counter — buttons</title>
<style>
  :root { --gold:#f0c96b; --gold-hot:#ffe6a8; --line:#1e2a36; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    background:
      radial-gradient(80% 60% at 50% -10%, rgba(240,201,107,.12), transparent 60%),
      linear-gradient(165deg,#12181f,#0a0e13 60%,#07090c);
    color:#f5ecd8; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:26px;
  }
  .wrap { width:100%; max-width:440px; }
  .eyebrow { font-size:11px; font-weight:800; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); }
  .dot.offline { background:#ff8a7a; box-shadow:0 0 10px #ff8a7a; }

  .num {
    font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:86px; line-height:.95;
    font-variant-numeric:tabular-nums; text-align:center; margin:4px 0 22px;
    background:linear-gradient(180deg,#fff6dd,var(--gold) 64%,#b98a35);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button {
    appearance:none; border:0; cursor:pointer; font:inherit; font-weight:800;
    padding:20px 10px; border-radius:14px; font-size:19px;
  }
  .plus { background:linear-gradient(180deg,var(--gold-hot),var(--gold) 55%,#c39a3f); color:#1a1204;
    box-shadow:0 12px 26px rgba(240,201,107,.22), inset 0 1px 0 rgba(255,255,255,.6); }
  .minus { background:#141d26; color:#e6eef7; border:1px solid var(--line); }
  .reset { grid-column:1 / -1; background:#101821; color:#9fadbb; border:1px solid var(--line); font-size:14px; padding:14px; }
  button:active { transform:translateY(1px) scale(.995); }
  .hint { margin-top:18px; font-size:12.5px; line-height:1.6; color:#7d8b9a; text-align:center; }
  .hint code { color:var(--gold); background:#131b24; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span class="dot" id="dot"></span>Odinheim counter</div>
  <div class="num" id="num">0</div>
  <div class="btns">
    <button class="plus" data-bump="1">+ 1</button>
    <button class="minus" data-bump="-1">&minus; 1</button>
    <button class="reset" id="reset">Reset to 0</button>
  </div>
  <p class="hint">Works from your phone too — open <code>http://&lt;your-pc-ip&gt;:7391/app</code> on the
    same Wi-Fi. Or map these buttons to a Stream Deck's web page.</p>
</div>

<script>
const numEl = document.getElementById("num");
const dotEl = document.getElementById("dot");
const fmt = (n) => n.toLocaleString("en-US");

const paint = (n) => { numEl.textContent = fmt(n); };

async function call(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error("HTTP " + res.status);
    paint((await res.json()).count);
  } catch (e) {
    dotEl.classList.add("offline");
    numEl.textContent = "—";
  }
}

document.querySelectorAll("[data-bump]").forEach((btn) => {
  btn.addEventListener("click", () => call("/api/bump?d=" + btn.dataset.bump));
});
document.getElementById("reset").addEventListener("click", () => call("/api/reset"));

const source = new EventSource("/events");
source.onmessage = (e) => {
  try {
    const d = JSON.parse(e.data);
    if (Number.isFinite(d.count)) paint(d.count);
  } catch {}
};
source.onopen = () => dotEl.classList.remove("offline");
source.onerror = () => dotEl.classList.add("offline");

fetch("/api/state").then((r) => r.json()).then((d) => paint(d.count)).catch(() => {});
</script>
</body>
</html>
