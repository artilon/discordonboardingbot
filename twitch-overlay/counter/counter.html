<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Odinheim — ToA dry counter</title>
<!--
  TOMBS OF AMASSCUT — DRY COUNTER OVERLAY
  ==========================================================================
  Big number = chests opened since your last purple.

    one press per chest   -> +1
    one press when purple -> records the streak, updates your best, back to 0

  It does NOT read your keyboard itself: an OBS browser source only sees keys
  while its Interact window is focused. So the count lives in the local server
  (counter-server.js) and a global-hotkey listener pushes to it.

      node twitch-overlay/counter/counter-server.js

  OBS Browser Source ->  http://127.0.0.1:7391/   (not Local file)

  URL options:
      ?label=Chests       number label (default: Chests)
      &eyebrow=TOMBS OF AMASSCUT
      &sub=since purple
      &stats=false        hide the "best / purples" line
      &pos=pos-top-right  -bottom-right, -top-left, -bottom-left, pos-center
      &scale=1.3
      &wander=20          bounce around the screen every N minutes (0 = off)
      &wander-seconds=20  how long it roams before springing back home
      &purple-seconds=45  how long the HUD stays violet after a purple
-->

<style>
  :root {
    --gold: #f0c96b;
    --gold-hot: #ffe6a8;
    --parchment: #f5ecd8;
    --muted: #a9b4c2;
    --up: #7ee2a8;
    --down: #ff8a7a;
    --purple: #b06bff;
    --purple-hot: #e5c7ff;
    --scale: 1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: fixed; inset: 0;
    display: flex; padding: 48px;
    align-items: flex-end; justify-content: flex-start;
    pointer-events: none;
  }
  #stage.pos-bottom-left  { justify-content: flex-start; align-items: flex-end; }
  #stage.pos-bottom-right { justify-content: flex-end;   align-items: flex-end; }
  #stage.pos-top-left     { justify-content: flex-start; align-items: flex-start; }
  #stage.pos-top-right    { justify-content: flex-end;   align-items: flex-start; }
  #stage.pos-center       { justify-content: center;     align-items: center; }

  .hud {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    padding: calc(16px * var(--scale)) calc(32px * var(--scale)) calc(14px * var(--scale));
    border-radius: calc(18px * var(--scale));
    background:
      radial-gradient(120% 140% at 50% -20%, rgba(240, 201, 107, 0.16), transparent 60%),
      linear-gradient(165deg, rgba(22, 29, 39, 0.96), rgba(8, 12, 17, 0.97));
    border: 1px solid rgba(240, 201, 107, 0.40);
    box-shadow:
      0 18px 44px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: border-color 200ms ease, box-shadow 200ms ease;
  }

  /* a chest was opened */
  .hud.up {
    border-color: rgba(240, 201, 107, 0.85);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55), 0 0 34px rgba(240, 201, 107, 0.30);
  }

  /* wandering: bouncing around the screen, gentle gold glow */
  .hud.wandering {
    border-color: rgba(240, 201, 107, 0.9);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55), 0 0 44px rgba(240, 201, 107, 0.45);
  }

  /* THE PURPLE */
  .hud.purple {
    border-color: rgba(176, 107, 255, 0.95);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55), 0 0 60px rgba(176, 107, 255, 0.55);
    animation: purpleShake 620ms ease-out;
  }
  @keyframes purpleShake {
    0%   { transform: scale(1); }
    18%  { transform: scale(1.06) rotate(-0.5deg); }
    38%  { transform: scale(1.02) rotate(0.4deg); }
    60%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  .eyebrow {
    font: 800 calc(10px * var(--scale)) / 1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: calc(9px * var(--scale));
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 10px var(--gold);
    transition: background 200ms ease, box-shadow 200ms ease;
  }
  .dot.offline { background: var(--down); box-shadow: 0 0 10px var(--down); }

  .count {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: calc(96px * var(--scale));
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    color: transparent;
    background: linear-gradient(180deg, #fff6dd 8%, var(--gold) 62%, #b98a35 100%);
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: 0 3px 22px rgba(240, 201, 107, 0.20);
    transition: transform 140ms cubic-bezier(0.2, 1.6, 0.4, 1), filter 200ms ease;
  }
  .hud.up .count { transform: scale(1.06); }
  .hud.purple .count { filter: drop-shadow(0 0 22px rgba(176, 107, 255, 0.8)); }

  .sub {
    margin-top: calc(8px * var(--scale));
    font: 600 calc(11.5px * var(--scale)) / 1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.8;
  }

  .stats {
    margin-top: calc(9px * var(--scale));
    font: 600 calc(10.5px * var(--scale)) / 1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    color: rgba(169, 180, 194, 0.6);
  }
  .stats b { color: rgba(240, 201, 107, 0.85); font-weight: 700; }

  .ghost {
    position: absolute;
    right: calc(14px * var(--scale));
    top: calc(6px * var(--scale));
    font: 800 calc(14px * var(--scale)) / 1 ui-sans-serif, system-ui, sans-serif;
    color: var(--up);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .ghost.minus { color: var(--down); }
  .ghost.purple { color: var(--purple-hot); text-shadow: 0 0 16px var(--purple); font-size: calc(16px * var(--scale)); }
  .ghost.go { animation: floatUp 950ms ease-out forwards; }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(6px) scale(0.92); }
    20%  { opacity: 1; transform: translateY(-4px) scale(1); }
    100% { opacity: 0; transform: translateY(-30px) scale(1); }
  }

  /* fanfare banner on a purple */
  .banner {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: calc(52px * var(--scale));
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--purple-hot);
    text-shadow: 0 0 26px rgba(176, 107, 255, 0.9), 0 2px 10px rgba(0, 0, 0, 0.6);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .banner.go { animation: bannerPop 2s ease-out forwards; }
  @keyframes bannerPop {
    0%   { opacity: 0; transform: scale(0.4) rotate(-3deg); }
    18%  { opacity: 1; transform: scale(1.15) rotate(1deg); }
    30%  { transform: scale(1) rotate(0deg); }
    75%  { opacity: 1; transform: scale(1.03); }
    100% { opacity: 0; transform: scale(1.08) translateY(-8px); }
  }

  /* confetti burst on a purple */
  .confetti-wrap { position: absolute; inset: 0; pointer-events: none; }
  .confetti { position: absolute; top: -8px; border-radius: 2px; }

  /* the shockwave ring on a purple */
  .ring {
    position: absolute; inset: 0;
    border-radius: inherit;
    border: 2px solid var(--purple);
    opacity: 0;
    pointer-events: none;
  }
  .ring.go { animation: shock 900ms ease-out forwards; }
  @keyframes shock {
    0%   { opacity: 0.9; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.35); }
  }

  @media (prefers-reduced-motion: reduce) {
    .count, .hud { transition: none !important; animation: none !important; }
    .ghost.go, .ring.go, .banner.go { animation: none !important; }
  }
</style>
</head>
<body>

<div id="stage" class="pos-bottom-left">
  <div class="hud" id="hud">
    <div class="eyebrow"><span class="dot" id="dot"></span><span id="eyebrow">Tombs of Amascut</span></div>
    <span class="count" id="count">0</span>
    <div class="sub" id="sub">chests since purple</div>
    <div class="stats" id="stats">best <b>0</b> &middot; <b>0</b> purples</div>
    <span class="ghost" id="ghost">+1</span>
    <span class="ring" id="ring"></span>
    <div class="banner" id="banner"></div>
    <div class="confetti-wrap" id="confettiWrap"></div>
  </div>
</div>

<script>
/* ======================= EDIT ME (or use URL params) ======================= */
const CONFIG = {
  EYEBROW: "Tombs of Amascut",   // small gold line up top
  SUB: "chests since purple",    // small line under the number
  SHOW_STATS: true,              // the "best / purples" line
  POSITION: "pos-bottom-left",
  SCALE: 1,                      // 1.3 = bigger HUD
  WANDER_MINUTES: 20,            // bounce around the screen every N minutes (0 = off)
  WANDER_SECONDS: 20,            // how long it roams before springing back home
  PURPLE_SECONDS: 45             // how long the HUD stays violet after a purple
};
/* ========================================================================= */

const params = new URLSearchParams(location.search);
const pick = (k, fallback) => (params.has(k) ? params.get(k) : fallback);

const EYEBROW = pick("eyebrow", CONFIG.EYEBROW);
const SUB = pick("sub", CONFIG.SUB);
const SHOW_STATS = String(pick("stats", CONFIG.SHOW_STATS)) !== "false";
const POSITION = pick("pos", CONFIG.POSITION);
const SCALE = Number(pick("scale", CONFIG.SCALE)) || 1;
const WANDER_MINUTES = Number(pick("wander", CONFIG.WANDER_MINUTES));
const WANDER_SECONDS = Number(pick("wander-seconds", CONFIG.WANDER_SECONDS)) || 20;
const PURPLE_SECONDS = Number(pick("purple-seconds", CONFIG.PURPLE_SECONDS)) || 45;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const stage = document.getElementById("stage");
const hud = document.getElementById("hud");
const countEl = document.getElementById("count");
const ghostEl = document.getElementById("ghost");
const ringEl = document.getElementById("ring");
const bannerEl = document.getElementById("banner");
const confettiWrap = document.getElementById("confettiWrap");
const dotEl = document.getElementById("dot");
const statsEl = document.getElementById("stats");

document.getElementById("eyebrow").textContent = EYEBROW;
document.getElementById("sub").textContent = SUB;
statsEl.style.display = SHOW_STATS ? "" : "none";
stage.className = POSITION;
document.documentElement.style.setProperty("--scale", SCALE);

let last = null;
let timers = [];
let purpleTimer = null;   // dedicated: must survive clearTimers(), or the border sticks

const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function paintStats(s) {
  if (!SHOW_STATS) return;
  statsEl.innerHTML = `best <b>${Number(s.best || 0).toLocaleString("en-US")}</b> &middot; ` +
                      `<b>${Number(s.purples || 0).toLocaleString("en-US")}</b> purples`;
}

/* PURPLE fanfare: big banner + confetti burst over the HUD */
function fanfare() {
  bannerEl.textContent = "PURPLE!";
  bannerEl.classList.remove("go"); void bannerEl.offsetWidth; bannerEl.classList.add("go");
  later(() => bannerEl.classList.remove("go"), 2100);
  if (reduceMotion) return;
  const colors = ["#f0c96b", "#ffe6a8", "#b06bff", "#e5c7ff", "#ffffff"];
  const W = hud.offsetWidth, H = hud.offsetHeight;
  for (let i = 0; i < 36; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    const size = 5 + Math.random() * 6;
    c.style.width = size + "px";
    c.style.height = (size * (0.5 + Math.random())) + "px";
    c.style.left = (Math.random() * W) + "px";
    c.style.background = colors[(Math.random() * colors.length) | 0];
    confettiWrap.appendChild(c);
    const dx = (Math.random() - 0.5) * 120;
    const dy = H + 40 + Math.random() * 60;
    const rot = (Math.random() - 0.5) * 720;
    const anim = c.animate(
      [
        { transform: "translate(0px, 0px) rotate(0deg)", opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 0 }
      ],
      { duration: 1100 + Math.random() * 900, delay: Math.random() * 250, easing: "cubic-bezier(0.2, 0.7, 0.3, 1)", fill: "forwards" }
    );
    anim.onfinish = () => c.remove();
  }
}

function popGhost(text, cls) {
  ghostEl.textContent = text;
  ghostEl.className = "ghost" + (cls ? " " + cls : "");
  void ghostEl.offsetWidth;
  ghostEl.classList.add("go");
}

function render(state) {
  const prev = last ? last.count : state.count;
  const isPurple = state.event === "purple";

  countEl.textContent = Number(state.count || 0).toLocaleString("en-US");
  paintStats(state);

  clearTimers();

  if (isPurple) {
    hud.classList.add("purple");
    ringEl.classList.remove("go"); void ringEl.offsetWidth; ringEl.classList.add("go");
    fanfare();
    popGhost(`PURPLE! ${Number(state.streak || prev).toLocaleString("en-US")} dry`, "purple");
    if (purpleTimer) clearTimeout(purpleTimer);
    purpleTimer = setTimeout(() => hud.classList.remove("purple"), PURPLE_SECONDS * 1000);
    later(() => ringEl.classList.remove("go"), 1000);
  } else if (state.count > prev) {
    hud.classList.add("up");
    popGhost(`+${state.count - prev}`, "");
    later(() => hud.classList.remove("up"), 220);
    later(() => ghostEl.classList.remove("go"), 1000);
  } else if (state.count < prev) {
    popGhost(`${state.count - prev}`, "minus");
    later(() => ghostEl.classList.remove("go"), 1000);
  }

  last = { ...state };
}

/* ---- wander: every N minutes the HUD bounces around the screen for a few
   seconds, then springs back to its home spot. The translate goes on #stage
   (not .hud) so it never fights the purple shake animation, which also uses
   transform. ?wander=20 (minutes, 0 = off) &wander-seconds=20 ---- */
let wandering = false;

function randomHop(home) {
  const margin = 24;
  const w = hud.offsetWidth, h = hud.offsetHeight;
  const maxX = Math.max(margin, window.innerWidth - w - margin);
  const maxY = Math.max(margin, window.innerHeight - h - margin);
  const tx = margin + Math.random() * (maxX - margin);
  const ty = margin + Math.random() * (maxY - margin);
  return { x: tx - home.left, y: ty - home.top, r: (Math.random() * 4 - 2).toFixed(2) };
}

async function doWander() {
  if (wandering || !Number.isFinite(WANDER_MINUTES) || WANDER_MINUTES <= 0 || reduceMotion) return;
  wandering = true;
  hud.classList.add("wandering");
  const home = hud.getBoundingClientRect();
  const hops = Math.max(3, Math.round(WANDER_SECONDS / 3));
  const hopMs = (WANDER_SECONDS * 1000) / hops;
  for (let i = 0; i < hops; i++) {
    const p = randomHop(home);
    const anim = stage.animate(
      [{ transform: `translate(${p.x}px, ${p.y}px) rotate(${p.r}deg)` }],
      { duration: hopMs, easing: "cubic-bezier(0.34, 1.45, 0.64, 1)", fill: "forwards" }
    );
    try { await anim.finished; } catch {}
  }
  // spring back home
  const back = stage.animate(
    [{ transform: "translate(0px, 0px) rotate(0deg)" }],
    { duration: 700, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)", fill: "forwards" }
  );
  try { await back.finished; } catch {}
  stage.getAnimations().forEach((a) => a.cancel());
  stage.style.transform = "";
  hud.classList.remove("wandering");
  wandering = false;
}

function scheduleWander() {
  if (!Number.isFinite(WANDER_MINUTES) || WANDER_MINUTES <= 0 || reduceMotion) return;
  setTimeout(() => { doWander(); scheduleWander(); }, WANDER_MINUTES * 60 * 1000);
}

/* Live link to the counter server; EventSource reconnects on its own if the
   server restarts, so a scene refresh isn't needed after a reboot. */
const source = new EventSource("/events");
source.onmessage = (event) => {
  try {
    const state = JSON.parse(event.data);
    if (Number.isFinite(state.count)) render(state);
  } catch {}
};
source.onopen = () => dotEl.classList.remove("offline");
source.onerror = () => dotEl.classList.add("offline");

fetch("/api/state").then((r) => r.json()).then(render).catch(() => {});

scheduleWander();
</script>
</body>
</html>
